<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARVEY — Lyrics</title>

<style>

/* =====================================================
   RESET & BASE STYLES
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08080c;
    color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

button{
    border:none;
    outline:none;
    background:none;
    color:white;
    cursor:pointer;
}


/* =====================================================
   DYNAMIC AMBIENT BACKGROUND
===================================================== */

.bg{
    position:fixed;
    inset:-100px;
    background: url("cover.jpg") center/cover no-repeat;
    filter: blur(90px) brightness(0.4) saturate(1.4);
    transform: scale(1.2);
    z-index: -2;
    transition: all 0.5s ease;
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center, rgba(15,15,20,0.4) 0%, rgba(5,5,8,0.95) 100%);
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:60px;
    padding:0 40px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:100;
    background: linear-gradient(to bottom, rgba(5,5,8,0.6), transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.topbar strong{
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#e1e1e6;
}

.topbar span{
    color:#666;
    font-size:12px;
}


/* =====================================================
   MAIN CONTAINER (DESKTOP)
===================================================== */

.main{
    position:fixed;
    top:60px;
    left:0;
    right:0;
    bottom:96px;
    padding:0 8%;
    display:grid;
    grid-template-columns: 380px 1fr;
    column-gap:80px;
    align-items:center;
    overflow:hidden;
}


/* =====================================================
   LEFT / COVER & SONG INFO
===================================================== */

.left{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
}

.cover-wrapper {
    position: relative;
    width: 380px;
    height: 380px;
}

/* Ambient glow di belakang cover saat dimainkan */
.cover-glow {
    position: absolute;
    inset: 10px;
    background: url("cover.jpg") center/cover no-repeat;
    filter: blur(30px);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 1;
    border-radius: 16px;
}

.cover{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    background: url("cover.jpg") center/cover no-repeat;
    border-radius:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
}

.cover.playing {
    transform: scale(1.03);
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}

.cover.playing + .cover-glow {
    opacity: 0.6;
    transform: scale(1.05);
}

.song-info{
    width:100%;
    margin-top:24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.song-title{
    font-size:26px;
    font-weight:800;
    letter-spacing: -0.5px;
    color:#fff;
}

.artist{
    margin-top:6px;
    font-size:15px;
    font-weight:500;
    color:#a1a1aa;
}

.more{
    color:#71717a;
    font-size:18px;
    padding:8px;
    border-radius:50%;
    transition: background 0.2s, color 0.2s;
}

.more:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
}


/* =====================================================
   LYRICS CONTAINER
===================================================== */

.lyrics-box{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
    scroll-behavior:smooth;
    mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
    );
    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
    );
}

.lyrics-box::-webkit-scrollbar{
    display:none;
}

.lyrics{
    padding-top: 50vh;
    padding-bottom: 50vh;
}

.line{
    padding: 12px 0;
    font-size: 24px;
    line-height: 1.4;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.25);
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    transform-origin: left center;
    cursor: pointer;
}

.line:hover {
    color: rgba(255, 255, 255, 0.5);
}

.line.active{
    color: #ffffff;
    font-size: 32px;
    transform: translateX(4px);
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
}


/* =====================================================
   PLAYER BAR
===================================================== */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:96px;
    background: rgba(10, 10, 15, 0.75);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    z-index:9999;
}

.player-info{
    position:absolute;
    left:40px;
    top:50%;
    transform:translateY(-50%);
    width:200px;
}

.player-name{
    font-size:14px;
    font-weight:700;
    color:#fff;
}

.player-artist{
    margin-top:3px;
    font-size:12px;
    color:#888;
}

.controls{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
}

.controls button{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a1a1aa;
    font-size:18px;
    transition: all 0.2s ease;
}

.controls button:hover{
    color:#fff;
    transform: scale(1.1);
}

.controls button:active{
    transform:scale(0.9);
}

#play{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#fff;
    color:#000;
    box-shadow: 0 4px 20px rgba(255,255,255,0.25);
}

#play:hover{
    transform:scale(1.08);
    background: #f4f4f5;
    box-shadow: 0 6px 25px rgba(255,255,255,0.4);
}

.progress-row{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:min(600px, 50vw);
    display:flex;
    align-items:center;
    gap:12px;
    color:#71717a;
    font-size:11px;
    font-weight: 500;
}

.progress{
    flex:1;
    height:4px;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    position: relative;
    transition: height 0.2s ease;
}

.progress:hover {
    height: 6px;
}

.bar{
    width:0%;
    height:100%;
    background:#fff;
    border-radius:10px;
    transition: width 0.1s linear;
}


/* =====================================================
   RESPONSIVE DESIGN: TABLET
===================================================== */

@media(min-width:800px) and (max-width:1100px){
    .main{
        padding:0 5%;
        grid-template-columns: 300px 1fr;
        column-gap:40px;
    }

    .cover-wrapper {
        width: 300px;
        height: 300px;
    }

    .line{ font-size:20px; }
    .line.active{ font-size:26px; }
}


/* =====================================================
   RESPONSIVE DESIGN: MOBILE (FIXED & BEAUTIFIED)
===================================================== */

@media(max-width:799px){
    html, body {
        height: 100dvh;
    }

    .topbar {
        height: 50px;
        padding: 0 20px;
        justify-content: center;
    }

    .main {
        top: 50px;
        bottom: 110px;
        padding: 10px 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
    }

    /* Left Section / Cover Mobile */
    .left {
        width: 100%;
        align-items: center;
        flex-shrink: 0;
        margin-bottom: 10px;
    }

    .cover-wrapper {
        width: 160px;
        height: 160px;
    }

    .cover {
        border-radius: 10px;
    }

    .song-info {
        margin-top: 12px;
        justify-content: center;
        text-align: center;
    }

    .song-title {
        font-size: 18px;
    }

    .artist {
        font-size: 12px;
        margin-top: 2px;
    }

    .more {
        display: none; /* Sembunyikan tombol '...' di mobile agar rapi */
    }

    /* Lyrics Mobile Adjustments */
    .lyrics-box {
        width: 100%;
        flex: 1;
        mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            black 15%,
            black 85%,
            transparent 100%
        );
        -webkit-mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            black 15%,
            black 85%,
            transparent 100%
        );
    }

    .lyrics {
        padding-top: 35vh;
        padding-bottom: 35vh;
        text-align: center;
    }

    .line {
        padding: 10px 0;
        font-size: 16px;
        transform-origin: center center;
    }

    .line.active {
        font-size: 20px;
        transform: translateX(0) scale(1.05);
    }

    /* Player Mobile Adjustments */
    .player {
        height: 110px;
        padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .player-info {
        display: none; /* Hide player info di bottom bar mobile karena sudah di atas */
    }

    .controls {
        position: static;
        transform: none;
        width: 100%;
        margin-bottom: 12px;
        gap: 36px;
    }

    .progress-row {
        position: static;
        transform: none;
        width: 100%;
    }
}


/* =====================================================
   SMALL PHONE SCREEN FIX
===================================================== */

@media(max-height:670px) and (max-width:799px){
    .cover-wrapper {
        width: 120px;
        height: 120px;
    }
    
    .song-title { font-size: 16px; }
    .artist { font-size: 11px; }

    .line { font-size: 14px; padding: 8px 0; }
    .line.active { font-size: 17px; }
}

</style>
</head>


<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- TOP BAR -->
<header class="topbar">
    <strong>HARVEY</strong>
    <span>•</span>
    <span>Lyrics</span>
</header>

<!-- MAIN CONTENT -->
<main class="main">

    <!-- COVER SECTION -->
    <section class="left">
        <div class="cover-wrapper">
            <div class="cover" id="cover"></div>
            <div class="cover-glow"></div>
        </div>

        <div class="song-info">
            <div>
                <div class="song-title">HARVEY</div>
                <div class="artist">Her's</div>
            </div>
            <button class="more">•••</button>
        </div>
    </section>

    <!-- LYRICS SECTION -->
    <section class="lyrics-box" id="lyricsBox">
        <div class="lyrics" id="lyrics"></div>
    </section>

</main>

<!-- PLAYER CONTROL BAR -->
<footer class="player">

    <div class="player-info">
        <div>
            <div class="player-name">HARVEY</div>
            <div class="player-artist">Her's</div>
        </div>
    </div>

    <div class="controls">
        <button id="previous" title="Previous">⏮</button>
        <button id="play" title="Play/Pause">▶</button>
        <button id="next" title="Next">⏭</button>
    </div>

    <div class="progress-row">
        <span id="current">0:00</span>
        <div class="progress" id="progress">
            <div class="bar" id="bar"></div>
        </div>
        <span id="duration">0:00</span>
    </div>

</footer>

<!-- AUDIO ELEMENT -->
<audio id="audio" src="harvey.mp3" preload="metadata"></audio>

<script>

/* =====================================================
   TIMESTAMPS & LYRICS DATA
===================================================== */

const timestamps = [
    30.96, 34.95, 38.06, 42.09, 45.00, 46.38, 48.76, 50.25, 52.20, 53.61, 
    55.67, 56.88, 57.90, 59.61, 62.88, 66.31, 71.36, 73.05, 76.42, 79.83, 
    85.06, 111.87, 113.56, 116.92, 120.35, 125.40, 127.13, 130.50, 133.87, 
    138.92, 152.48, 154.15, 157.46, 160.90, 165.93, 167.63, 171.10, 174.40, 
    179.53, 181.23, 184.49, 187.96
];

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];

/* =====================================================
   ELEMENT REFERENCES
===================================================== */

const audio = document.getElementById("audio");
const play = document.getElementById("play");
const previous = document.getElementById("previous");
const next = document.getElementById("next");
const cover = document.getElementById("cover");
const lyrics = document.getElementById("lyrics");
const lyricsBox = document.getElementById("lyricsBox");
const progress = document.getElementById("progress");
const bar = document.getElementById("bar");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

/* =====================================================
   GENERATE LYRICS ELEMENTS
===================================================== */

timestamps.forEach((time, index) => {
    const line = document.createElement("div");
    line.className = "line";
    line.dataset.time = time;
    line.textContent = texts[index] || "";
    
    // Klik pada lirik untuk langsung lompat ke detik lagu
    line.addEventListener("click", () => {
        audio.currentTime = time;
        updateLyrics();
    });

    lyrics.appendChild(line);
});

const lines = [...document.querySelectorAll(".line")];

/* =====================================================
   HELPER FUNCTIONS
===================================================== */

function formatTime(time){
    if(!isFinite(time)) return "0:00";
    const minutes = Math.floor(time / 60);
    let seconds = Math.floor(time % 60);
    if(seconds < 10) seconds = "0" + seconds;
    return minutes + ":" + seconds;
}

/* =====================================================
   AUDIO CONTROLS & LISTENERS
===================================================== */

play.addEventListener("click", async () => {
    if(audio.paused){
        try {
            await audio.play();
        } catch(error){
            console.log("Play failed:", error);
        }
    } else {
        audio.pause();
    }
});

audio.addEventListener("play", () => {
    play.textContent = "❚❚";
    cover.classList.add("playing");
});

audio.addEventListener("pause", () => {
    play.textContent = "▶";
    cover.classList.remove("playing");
});

/* =====================================================
   LYRICS AUTO-SCROLLING SYNC
===================================================== */

let activeIndex = -1;

function updateLyrics(){
    let index = -1;

    for(let i = 0; i < timestamps.length; i++){
        if(audio.currentTime >= timestamps[i]){
            index = i;
        } else {
            break;
        }
    }

    if(index === activeIndex) return;
    activeIndex = index;

    lines.forEach(line => line.classList.remove("active"));

    if(index >= 0){
        const line = lines[index];
        line.classList.add("active");

        // Perhitungan Scroll Presisi Tengah (Desktop & Mobile)
        const boxRect = lyricsBox.getBoundingClientRect();
        const lineRect = line.getBoundingClientRect();

        const target = lyricsBox.scrollTop + 
                       (lineRect.top - boxRect.top) - 
                       (lyricsBox.clientHeight / 2) + 
                       (lineRect.height / 2);

        lyricsBox.scrollTo({
            top: Math.max(0, target),
            behavior: "smooth"
        });
    }
}

/* =====================================================
   TIME UPDATE & PROGRESS
===================================================== */

audio.addEventListener("timeupdate", () => {
    current.textContent = formatTime(audio.currentTime);
    duration.textContent = formatTime(audio.duration);

    if(audio.duration){
        bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
    }

    updateLyrics();
});

audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
});

progress.addEventListener("click", (event) => {
    if(!audio.duration) return;
    const rect = progress.getBoundingClientRect();
    const percent = (event.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
    activeIndex = -1;
    updateLyrics();
});

/* =====================================================
   PREVIOUS / NEXT BUTTONS
===================================================== */

previous.addEventListener("click", () => {
    audio.currentTime = 0;
    activeIndex = -1;
    lyricsBox.scrollTo({ top: 0, behavior: "smooth" });
    updateLyrics();
});

next.addEventListener("click", () => {
    let index = -1;
    for(let i = 0; i < timestamps.length; i++){
        if(audio.currentTime >= timestamps[i]){
            index = i;
        }
    }
    const nextIndex = index + 1;
    if(nextIndex < timestamps.length){
        audio.currentTime = timestamps[nextIndex];
        activeIndex = -1;
        updateLyrics();
    }
});

audio.addEventListener("ended", () => {
    play.textContent = "▶";
    cover.classList.remove("playing");
    activeIndex = -1;
});

/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener("keydown", (event) => {
    if(event.code === "Space" && event.target.tagName !== "INPUT" && event.target.tagName !== "TEXTAREA"){
        event.preventDefault();
        play.click();
    }
});

</script>

</body>
</html>
