<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HARVEY — Lyrics</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:fixed;
    inset:0;
}


/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:-50px;

    background:url("cover.jpg") center/cover no-repeat;

    filter:blur(55px);
    transform:scale(1.15);

    opacity:.22;

    z-index:-2;
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.72);
}


/* =========================
   TOP BAR
========================= */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:55px;

    display:flex;
    align-items:center;

    padding:0 14px;

    z-index:100;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        transparent
    );

    font-size:11px;
}

.top b{
    font-size:11px;
    letter-spacing:.8px;
}

.top span{
    margin-left:8px;
    color:#777;
}


/* =========================
   MAIN
========================= */

.main{
    position:fixed;

    top:55px;
    left:0;
    right:0;

    /*
      WAJIB kasih ruang untuk player
    */
    bottom:112px;

    padding:12px 16px 0;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================
   COVER
========================= */

.cover{
    width:62vw;
    max-width:260px;
    min-width:170px;

    aspect-ratio:1/1;

    background:url("cover.jpg") center/cover no-repeat;

    border-radius:2px;

    flex-shrink:0;

    box-shadow:
        0 20px 50px rgba(0,0,0,.75);

    transition:.4s ease;
}

.cover.playing{
    transform:scale(1.015);

    box-shadow:
        0 20px 55px rgba(0,0,0,.85),
        0 0 40px rgba(255,255,255,.05);
}


/* =========================
   SONG INFO
========================= */

.info{
    width:100%;
    max-width:500px;

    margin-top:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    flex-shrink:0;
}

.title{
    font-size:17px;
    font-weight:700;
    letter-spacing:.7px;
}

.artist{
    margin-top:4px;
    font-size:10px;
    color:#777;
}

.more{
    color:#777;
    font-size:16px;
}


/* =========================
   LYRICS
========================= */

.lyrics-box{
    width:100%;
    max-width:500px;

    flex:1;
    min-height:0;

    margin-top:12px;

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;

    scroll-behavior:smooth;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 12%,
            black 88%,
            transparent 100%
        );
}

.lyrics-box::-webkit-scrollbar{
    display:none;
}

.lyrics{
    padding-top:80px;
    padding-bottom:100px;
}

.line{
    padding:7px 0;

    font-size:14px;
    line-height:1.35;

    font-weight:600;

    color:#292929;

    opacity:.55;

    transition:
        .35s ease;

    word-wrap:break-word;
}

.line.active{
    color:white;

    opacity:1;

    font-size:19px;

    font-weight:700;

    text-shadow:
        0 0 18px rgba(255,255,255,.12);
}


/* =========================
   PLAYER
========================= */

.player{
    position:fixed !important;

    left:0 !important;
    right:0 !important;
    bottom:0 !important;

    width:100% !important;

    height:112px !important;

    padding:
        7px 14px
        calc(7px + env(safe-area-inset-bottom))
        !important;

    background:rgba(8,8,8,.97);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-top:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -15px 35px rgba(0,0,0,.55);

    z-index:999999 !important;

    display:block !important;
}


/* =========================
   PLAYER INFO
========================= */

.player-info{
    height:20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.player-name{
    font-size:11px;
    font-weight:700;
}

.player-artist{
    font-size:9px;
    color:#666;
}


/* =========================
   BUTTONS
========================= */

.buttons{
    height:46px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:34px;

    position:relative;

    z-index:1000000;
}

.buttons button{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:none;

    border:none;

    color:#ddd;

    font-size:17px;

    cursor:pointer;

    flex-shrink:0;
}

#play{
    width:42px !important;
    height:42px !important;

    border-radius:50%;

    background:white;

    color:black !important;

    font-size:12px !important;

    font-weight:bold;

    box-shadow:
        0 5px 20px rgba(0,0,0,.55);

    z-index:1000001;
}


/* =========================
   PROGRESS
========================= */

.progress-row{
    width:100%;

    height:17px;

    display:flex;
    align-items:center;

    gap:7px;

    color:#666;

    font-size:8px;
}

.progress{
    position:relative;

    flex:1;

    height:3px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.bar{
    width:0%;
    height:100%;

    background:white;

    border-radius:20px;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:800px){

    .main{
        top:60px;
        bottom:95px;

        padding:25px 7%;

        display:grid;

        grid-template-columns:
            minmax(300px,420px)
            1fr;

        gap:80px;
    }

    .cover{
        width:100%;
        max-width:420px;
    }

    .title{
        font-size:25px;
    }

    .artist{
        font-size:13px;
    }

    .line{
        font-size:20px;
        padding:8px 0;
    }

    .line.active{
        font-size:27px;
    }

    .player{
        height:95px !important;

        padding:
            10px 35px !important;

        display:flex !important;

        align-items:center;
        justify-content:center;
    }

    .player-info{
        position:absolute;
        left:35px;

        display:block;
    }

    .player-artist{
        margin-top:4px;
    }

    .buttons{
        width:300px;
    }
}


/* =========================
   HP KECIL
========================= */

@media(max-height:650px){

    .main{
        bottom:105px;
    }

    .player{
        height:105px !important;
    }

    .cover{
        width:45vw;
        min-width:145px;
    }

    .info{
        margin-top:8px;
    }

    .lyrics-box{
        margin-top:7px;
    }

    .line{
        padding:5px 0;
        font-size:13px;
    }

    .line.active{
        font-size:17px;
    }
}

</style>
</head>


<body>

<div class="bg"></div>


<header class="top">
    <b>HARVEY</b>
    <span>•</span>
    <span>Lyrics</span>
</header>


<main class="main">

    <div
        class="cover"
        id="cover">
    </div>


    <div class="info">

        <div>
            <div class="title">HARVEY</div>
            <div class="artist">Her's</div>
        </div>

        <button class="more">•••</button>

    </div>


    <div
        class="lyrics-box"
        id="lyricsBox">

        <div
            class="lyrics"
            id="lyrics">
        </div>

    </div>

</main>


<!-- PLAYER -->

<footer class="player">

    <div class="player-info">

        <div class="player-name">
            HARVEY
        </div>

        <div class="player-artist">
            Her's
        </div>

    </div>


    <div class="buttons">

        <button id="previous">⏮</button>

        <button id="play">▶</button>

        <button id="next">⏭</button>

    </div>


    <div class="progress-row">

        <span id="current">0:00</span>

        <div
            class="progress"
            id="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>

        <span id="duration">0:00</span>

    </div>

</footer>


<audio
    id="audio"
    src="harvey.mp3"
    preload="metadata">
</audio>


<script>

/* =========================================
   TIMESTAMP
========================================= */

const timestamps = [
    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,
    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,
    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96
];


/* =========================================
   TEKS
   EDIT SENDIRI DI SINI
========================================= */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsBox =
    document.getElementById("lyricsBox");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =========================================
   CREATE LYRICS
========================================= */

timestamps.forEach((time,index)=>{

    const line =
        document.createElement("div");

    line.className = "line";

    line.dataset.time = time;

    line.textContent =
        texts[index] || "";

    lyrics.appendChild(line);

});


const lines =
    [...document.querySelectorAll(".line")];


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(time){

    if(!isFinite(time))
        return "0:00";

    const min =
        Math.floor(time/60);

    let sec =
        Math.floor(time%60);

    if(sec < 10)
        sec = "0"+sec;

    return min+":"+sec;
}


/* =========================================
   PLAY / PAUSE
========================================= */

play.onclick = async ()=>{

    if(audio.paused){

        await audio.play();

        play.textContent = "❚❚";

        cover.classList.add("playing");

    }else{

        audio.pause();

        play.textContent = "▶";

        cover.classList.remove("playing");

    }

};


/* =========================================
   LYRICS
========================================= */

let active = -1;


function updateLyrics(){

    let index = -1;

    for(let i=0;i<timestamps.length;i++){

        if(
            audio.currentTime >=
            timestamps[i]
        ){
            index = i;
        }else{
            break;
        }

    }


    if(index === active)
        return;

    active = index;


    lines.forEach(line=>{
        line.classList.remove("active");
    });


    if(index >= 0){

        const line =
            lines[index];

        line.classList.add("active");


        const target =
            line.offsetTop
            -
            lyricsBox.clientHeight/2
            +
            line.offsetHeight/2;


        lyricsBox.scrollTo({

            top:target,

            behavior:"smooth"

        });

    }

}


/* =========================================
   AUDIO UPDATE
========================================= */

audio.ontimeupdate = ()=>{

    current.textContent =
        formatTime(
            audio.currentTime
        );

    duration.textContent =
        formatTime(
            audio.duration
        );


    if(audio.duration){

        bar.style.width =
            (
                audio.currentTime /
                audio.duration *
                100
            )+"%";

    }


    updateLyrics();

};


/* =========================================
   PROGRESS
========================================= */

progress.onclick = e=>{

    if(!audio.duration)
        return;

    const rect =
        progress.getBoundingClientRect();

    const percent =
        (e.clientX-rect.left) /
        rect.width;

    audio.currentTime =
        percent *
        audio.duration;

    active = -1;

    updateLyrics();

};


/* =========================================
   PREVIOUS
========================================= */

previous.onclick = ()=>{

    audio.currentTime = 0;

    active = -1;

    lyricsBox.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =========================================
   NEXT
========================================= */

next.onclick = ()=>{

    let index = -1;

    for(let i=0;i<timestamps.length;i++){

        if(
            audio.currentTime >=
            timestamps[i]
        ){
            index=i;
        }

    }

    if(index+1 < timestamps.length){

        audio.currentTime =
            timestamps[index+1];

        active=-1;

    }

};


/* =========================================
   END
========================================= */

audio.onended = ()=>{

    play.textContent="▶";

    cover.classList.remove("playing");

    active=-1;

};


/* =========================================
   SPACE
========================================= */

document.onkeydown = e=>{

    if(e.code==="Space"){

        e.preventDefault();

        play.click();

    }

};

</script>

</body>
</html>
