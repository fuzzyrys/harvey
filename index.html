<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARVEY — Lyrics</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#050505;
    color:#fff;

    font-family:Arial,Helvetica,sans-serif;
}

button{
    border:0;
    outline:0;
    background:none;
    color:white;
    font-family:inherit;
}


/* =====================================================
   BLURRED BACKGROUND
===================================================== */

.bg{
    position:fixed;
    inset:-80px;

    background:url("cover.jpg")
    center/cover no-repeat;

    filter:blur(65px);

    transform:scale(1.15);

    opacity:.20;

    z-index:-2;
}

.bg::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(0,0,0,.9)
        );
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:60px;

    display:flex;
    align-items:center;

    padding:0 35px;

    z-index:100;

    font-size:13px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent
        );
}

.topbar strong{
    font-size:13px;
    letter-spacing:.8px;
}

.topbar span{
    margin-left:9px;
    color:#666;
}


/* =====================================================
   MAIN DESKTOP
===================================================== */

.main{
    position:fixed;

    top:60px;
    left:0;
    right:0;
    bottom:96px;

    padding:
        25px 7%;

    display:grid;

    grid-template-columns:
        minmax(320px,430px)
        minmax(400px,1fr);

    gap:90px;

    align-items:center;
}


/* =====================================================
   LEFT SIDE
===================================================== */

.left{
    width:100%;
}

.cover{
    width:100%;
    max-width:430px;

    aspect-ratio:1/1;

    background:
        url("cover.jpg")
        center/cover no-repeat;

    border-radius:3px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.75);

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}

.cover.playing{
    transform:scale(1.01);

    box-shadow:
        0 30px 80px rgba(0,0,0,.9),
        0 0 50px rgba(255,255,255,.04);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{
    width:100%;

    margin-top:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.song-title{
    font-size:23px;
    font-weight:700;
    letter-spacing:.5px;
}

.artist{
    margin-top:4px;

    font-size:12px;

    color:#777;
}

.more{
    color:#777;
    font-size:17px;

    cursor:pointer;
}


/* =====================================================
   LYRICS AREA
===================================================== */

.lyrics-box{
    width:100%;
    height:100%;

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;

    scroll-behavior:smooth;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 14%,
            black 86%,
            transparent 100%
        );
}

.lyrics-box::-webkit-scrollbar{
    display:none;
}

.lyrics{
    padding-top:42%;
    padding-bottom:42%;
}

.line{
    padding:8px 0;

    font-size:20px;
    line-height:1.4;

    font-weight:700;

    color:#252525;

    opacity:.55;

    transition:
        color .35s ease,
        opacity .35s ease,
        transform .35s ease,
        font-size .35s ease;
}

.line.active{
    color:white;

    opacity:1;

    font-size:27px;

    transform:scale(1.01);

    text-shadow:
        0 0 20px
        rgba(255,255,255,.08);
}


/* =====================================================
   PLAYER DESKTOP
===================================================== */

.player{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:96px;

    background:
        rgba(7,7,7,.96);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 -15px 45px
        rgba(0,0,0,.5);

    z-index:999999;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =====================================================
   PLAYER INFO
===================================================== */

.player-info{
    position:absolute;

    left:35px;

    top:50%;

    transform:translateY(-50%);

    width:180px;
}

.player-name{
    font-size:12px;
    font-weight:700;
}

.player-artist{
    margin-top:4px;

    font-size:10px;

    color:#666;
}


/* =====================================================
   PLAYER CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:50%;
    top:40%;

    transform:translate(-50%,-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:30px;

    z-index:10;
}

.controls button{
    width:34px;
    height:34px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:17px;

    color:#ccc;

    cursor:pointer;

    transition:
        transform .15s ease,
        color .15s ease;
}

.controls button:hover{
    color:white;
}

.controls button:active{
    transform:scale(.86);
}


/* =====================================================
   PLAY
===================================================== */

#play{
    width:44px;
    height:44px;

    border-radius:50%;

    background:white;

    color:black;

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.55);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row{
    position:absolute;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:min(600px,55%);

    height:14px;

    display:flex;

    align-items:center;

    gap:8px;

    color:#666;

    font-size:9px;
}

.progress{
    flex:1;

    height:4px;

    background:#303030;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.bar{
    width:0%;
    height:100%;

    background:white;

    border-radius:20px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:799px){

    html,
    body{
        height:100dvh;
    }


    /* ===== TOP ===== */

    .topbar{
        height:52px;

        padding:0 13px;

        font-size:10px;
    }

    .topbar strong{
        font-size:10px;
    }


    /* ===== MAIN ===== */

    .main{
        position:fixed;

        top:52px;
        left:0;
        right:0;

        bottom:112px;

        padding:
            12px 15px 0;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:0;
    }


    /* ===== COVER ===== */

    .left{
        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;
    }

    .cover{
        width:62vw;

        max-width:255px;
        min-width:165px;

        flex-shrink:0;
    }


    /* ===== INFO ===== */

    .song-info{
        margin-top:12px;

        width:100%;
    }

    .song-title{
        font-size:17px;
        letter-spacing:.7px;
    }

    .artist{
        font-size:10px;
        margin-top:3px;
    }


    /* ===== LYRICS ===== */

    .lyrics-box{
        width:100%;

        flex:1;

        min-height:0;

        margin-top:12px;

        overflow-y:auto;
    }

    .lyrics{
        padding-top:80px;
        padding-bottom:100px;
    }

    .line{
        padding:7px 0;

        font-size:14px;

        line-height:1.4;

        color:#292929;
    }

    .line.active{
        font-size:19px;

        color:white;

        opacity:1;
    }


    /* =================================================
       MOBILE PLAYER
    ================================================= */

    .player{
        position:fixed !important;

        left:0 !important;
        right:0 !important;
        bottom:0 !important;

        width:100% !important;

        height:112px !important;

        display:block !important;

        padding:
            7px 14px
            calc(
                7px +
                env(safe-area-inset-bottom)
            );

        background:
            rgba(7,7,7,.98);

        z-index:999999 !important;
    }


    /* ===== MOBILE INFO ===== */

    .player-info{
        position:static;

        transform:none;

        width:100%;

        height:20px;

        display:flex;

        align-items:center;

        justify-content:space-between;
    }

    .player-name{
        font-size:11px;
    }

    .player-artist{
        font-size:9px;
    }


    /* ===== MOBILE CONTROLS ===== */

    .controls{
        position:static;

        transform:none;

        height:45px;

        display:flex;

        gap:30px;
    }

    .controls button{
        width:34px;
        height:34px;
    }

    #play{
        width:42px;
        height:42px;
    }


    /* ===== MOBILE PROGRESS ===== */

    .progress-row{
        position:static;

        transform:none;

        width:100%;

        height:17px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .main{
        bottom:108px;
    }

    .player{
        height:108px !important;
    }

    .cover{
        width:52vw;
        min-width:150px;
    }

    .line{
        font-size:13px;
    }

    .line.active{
        font-size:17px;
    }

    .controls{
        gap:26px;
    }
}


/* =====================================================
   SHORT PHONE
===================================================== */

@media(max-height:650px) and (max-width:799px){

    .main{
        bottom:105px;
    }

    .player{
        height:105px !important;
    }

    .cover{
        width:44vw;
        min-width:140px;
    }

    .song-info{
        margin-top:8px;
    }

    .lyrics-box{
        margin-top:7px;
    }

    .line{
        padding:5px 0;
        font-size:13px;
    }

    .line.active{
        font-size:17px;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="bg"></div>


<!-- TOP -->

<header class="topbar">

    <strong>HARVEY</strong>

    <span>•</span>

    <span>Lyrics</span>

</header>


<!-- MAIN -->

<main class="main">


    <!-- LEFT -->

    <section class="left">

        <div
            class="cover"
            id="cover">
        </div>


        <div class="song-info">

            <div>

                <div class="song-title">
                    HARVEY
                </div>

                <div class="artist">
                    Her's
                </div>

            </div>


            <button class="more">
                •••
            </button>

        </div>

    </section>


    <!-- LYRICS -->

    <section
        class="lyrics-box"
        id="lyricsBox">

        <div
            class="lyrics"
            id="lyrics">
        </div>

    </section>


</main>


<!-- =================================================
     PLAYER
================================================= -->

<footer class="player">


    <div class="player-info">

        <div class="player-name">
            HARVEY
        </div>

        <div class="player-artist">
            Her's
        </div>

    </div>


    <div class="controls">

        <button id="previous">
            ⏮
        </button>

        <button id="play">
            ▶
        </button>

        <button id="next">
            ⏭
        </button>

    </div>


    <div class="progress-row">

        <span id="current">
            0:00
        </span>

        <div
            class="progress"
            id="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>

        <span id="duration">
            0:00
        </span>

    </div>


</footer>


<!-- AUDIO -->

<audio
    id="audio"
    src="harvey.mp3"
    preload="metadata">
</audio>


<script>

/* =====================================================
   TIMESTAMP
===================================================== */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =====================================================
   TEKS LIRIK
===================================================== */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];

/* =====================================================
   ELEMENT
===================================================== */

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsBox =
    document.getElementById("lyricsBox");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =====================================================
   BUAT LIRIK
===================================================== */

timestamps.forEach((time,index)=>{

    const line =
        document.createElement("div");

    line.className = "line";

    line.dataset.time = time;

    line.textContent =
        texts[index] || "";

    lyrics.appendChild(line);

});


const lines =
    [...document.querySelectorAll(".line")];


/* =====================================================
   FORMAT WAKTU
===================================================== */

function formatTime(time){

    if(!isFinite(time))
        return "0:00";

    const minutes =
        Math.floor(time / 60);

    let seconds =
        Math.floor(time % 60);

    if(seconds < 10)
        seconds = "0" + seconds;

    return minutes + ":" + seconds;
}


/* =====================================================
   PLAY / PAUSE
===================================================== */

play.addEventListener(
    "click",
    async ()=>{

        if(audio.paused){

            try{

                await audio.play();

                play.textContent = "❚❚";

                cover.classList.add(
                    "playing"
                );

            }catch(error){

                console.log(error);

            }

        }else{

            audio.pause();

            play.textContent = "▶";

            cover.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   ACTIVE LYRICS
===================================================== */

let activeIndex = -1;


function updateLyrics(){

    let index = -1;


    for(
        let i = 0;
        i < timestamps.length;
        i++
    ){

        if(
            audio.currentTime >=
            timestamps[i]
        ){

            index = i;

        }else{

            break;

        }

    }


    if(index === activeIndex)
        return;


    activeIndex = index;


    lines.forEach(
        line=>{
            line.classList.remove(
                "active"
            );
        }
    );


    if(index >= 0){

        const line =
            lines[index];


        line.classList.add(
            "active"
        );


        const target =
            line.offsetTop
            -
            lyricsBox.clientHeight / 2
            +
            line.offsetHeight / 2;


        lyricsBox.scrollTo({

            top:Math.max(
                0,
                target
            ),

            behavior:"smooth"

        });

    }

}


/* =====================================================
   AUDIO UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    ()=>{

        current.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        if(audio.duration){

            bar.style.width =
                (
                    audio.currentTime /
                    audio.duration *
                    100
                ) + "%";

        }


        updateLyrics();

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   PROGRESS
===================================================== */

progress.addEventListener(
    "click",
    event=>{

        if(!audio.duration)
            return;


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;


        activeIndex = -1;

        updateLyrics();

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previous.addEventListener(
    "click",
    ()=>{

        audio.currentTime = 0;

        activeIndex = -1;

        lyricsBox.scrollTo({

            top:0,

            behavior:"smooth"

        });

        updateLyrics();

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    ()=>{

        let index = -1;


        for(
            let i = 0;
            i < timestamps.length;
            i++
        ){

            if(
                audio.currentTime >=
                timestamps[i]
            ){

                index = i;

            }

        }


        const nextIndex =
            index + 1;


        if(
            nextIndex <
            timestamps.length
        ){

            audio.currentTime =
                timestamps[nextIndex];

            activeIndex = -1;

            updateLyrics();

        }

    }
);


/* =====================================================
   END
===================================================== */

audio.addEventListener(
    "ended",
    ()=>{

        play.textContent = "▶";

        cover.classList.remove(
            "playing"
        );

        activeIndex = -1;

    }
);


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.code === "Space"){

            event.preventDefault();

            play.click();

        }

    }
);

</script>

</body>
</html>
