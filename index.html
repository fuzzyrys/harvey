<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARVEY — Lyrics</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#050505;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button{
    border:none;
    outline:none;
    background:none;
    color:white;
    cursor:pointer;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg{
    position:fixed;

    inset:-80px;

    background:
        url("cover.jpg")
        center/
        cover
        no-repeat;

    filter:blur(70px);

    transform:scale(1.15);

    opacity:.13;

    z-index:-2;
}

.bg::after{
    content:"";

    position:absolute;

    inset:0;

    background:#000;

    opacity:.8;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:60px;

    padding:0 35px;

    display:flex;

    align-items:center;

    gap:9px;

    z-index:100;
}

.topbar strong{
    font-size:13px;
}

.topbar span{
    color:#555;

    font-size:12px;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    position:fixed;

    top:60px;
    left:0;
    right:0;
    bottom:96px;

    padding:22px 6.5%;

    display:grid;

    grid-template-columns:
        430px
        minmax(400px,720px);

    column-gap:90px;

    align-items:center;

    overflow:hidden;
}


/* =====================================================
   LEFT / COVER
===================================================== */

.left{
    width:430px;

    align-self:center;
}

.cover{
    width:430px;
    height:390px;

    background:
        url("cover.jpg")
        center/
        cover
        no-repeat;

    border-radius:3px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.7);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.cover.playing{
    transform:scale(1.008);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.8);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{
    width:430px;

    margin-top:14px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.song-title{
    font-size:22px;

    font-weight:700;
}

.artist{
    margin-top:4px;

    font-size:12px;

    color:#777;
}

.more{
    color:#777;

    font-size:15px;
}


/* =====================================================
   LYRICS CONTAINER
===================================================== */

.lyrics-box{
    width:100%;
    height:100%;

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;

    scroll-behavior:smooth;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 15%,
            black 85%,
            transparent 100%
        );
}

.lyrics-box::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   LYRICS
===================================================== */

.lyrics{
    padding-top:35%;
    padding-bottom:35%;
}

.line{
    padding:7px 0;

    font-size:18px;

    line-height:1.45;

    font-weight:700;

    color:#555;

    opacity:.48;

    transition:
        color .3s ease,
        opacity .3s ease,
        transform .3s ease,
        font-size .3s ease;
}

.line.active{
    color:#fff;

    opacity:1;

    font-size:23px;

    transform:translateX(2px);

    text-shadow:
        0 0 25px
        rgba(255,255,255,.08);
}


/* =====================================================
   PLAYER
===================================================== */

.player{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:96px;

    background:
        rgba(5,5,5,.97);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    z-index:999999;
}


/* =====================================================
   PLAYER INFO
===================================================== */

.player-info{
    position:absolute;

    left:35px;
    top:50%;

    transform:translateY(-50%);

    width:180px;
}

.player-name{
    font-size:12px;

    font-weight:700;
}

.player-artist{
    margin-top:4px;

    font-size:10px;

    color:#666;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:32px;

    width:max-content;
}

.controls button{
    width:34px;
    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#999;

    font-size:16px;

    transition:
        color .15s ease,
        transform .15s ease;
}

.controls button:hover{
    color:#fff;
}

.controls button:active{
    transform:scale(.82);
}


/* =====================================================
   PLAY BUTTON
===================================================== */

#play{
    width:44px;
    height:44px;

    min-width:44px;
    min-height:44px;

    border-radius:50%;

    background:#fff;

    color:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

#play:hover{
    transform:scale(1.06);

    box-shadow:
        0 7px 25px
        rgba(255,255,255,.12);
}

#play:active{
    transform:scale(.91);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row{
    position:absolute;

    left:50%;
    bottom:9px;

    transform:
        translateX(-50%);

    width:min(650px,55vw);

    height:12px;

    display:flex;

    align-items:center;

    gap:8px;

    color:#666;

    font-size:9px;
}

.progress{
    flex:1;

    height:4px;

    background:#303030;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.bar{
    width:0%;

    height:100%;

    background:#fff;

    border-radius:20px;

    transition:
        width .05s linear;
}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:800px)
and (max-width:1100px){

    .main{
        padding:20px 35px;

        grid-template-columns:
            350px
            minmax(300px,1fr);

        column-gap:55px;
    }

    .left{
        width:350px;
    }

    .cover{
        width:350px;
        height:350px;
    }

    .song-info{
        width:350px;
    }

    .line{
        font-size:16px;
    }

    .line.active{
        font-size:21px;
    }
}


/* =====================================================
   MOBILE (FIXED LAYOUT & RESPONSIVE)
===================================================== */

@media(max-width:799px){

    html,
    body{
        height:100dvh;
    }

    .topbar{
        height:45px;

        padding:0 16px;

        gap:7px;
    }

    .topbar strong{
        font-size:11px;
    }

    .topbar span{
        font-size:10px;
    }

    .main{
        top:45px;

        bottom:100px;

        padding:10px 20px 0;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        overflow:hidden;
    }

    .left{
        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;

        flex-shrink:0;

        margin-bottom:12px;
    }

    .cover{
        width:150px;
        height:150px;

        min-width:unset;
        min-height:unset;

        box-shadow:0 10px 30px rgba(0,0,0,.5);
    }

    .song-info{
        width:100%;

        margin-top:10px;
    }

    .song-title{
        font-size:16px;
    }

    .artist{
        margin-top:2px;

        font-size:11px;
    }

    .lyrics-box{
        width:100%;

        flex:1;

        min-height:0;

        mask-image:
            linear-gradient(
                to bottom,
                transparent 0%,
                black 10%,
                black 90%,
                transparent 100%
            );
    }

    .lyrics{
        padding-top:40px;
        padding-bottom:120px;
        text-align:center;
    }

    .line{
        padding:8px 0;

        font-size:14px;

        line-height:1.4;
    }

    .line.active{
        font-size:17px;
    }

    .player{
        height:100px;

        padding:
            10px 16px
            calc(
                8px +
                env(safe-area-inset-bottom)
            );

        display:flex;

        flex-direction:column;

        justify-content:space-between;
    }

    .player-info{
        position:static;

        width:100%;

        height:auto;

        transform:none;

        display:flex;

        align-items:center;

        justify-content:space-between;

        display:none; /* Sembunyikan judul di player karena sudah ada di atas */
    }

    .controls{
        position:static;

        transform:none;

        width:100%;

        height:auto;

        display:flex;

        align-items:center;

        justify-content:center;

        gap:36px;

        margin-top:4px;
    }

    .controls button{
        width:36px;
        height:36px;

        font-size:18px;
    }

    #play{
        width:42px;
        height:42px;

        min-width:42px;
        min-height:42px;

        font-size:13px;
    }

    .progress-row{
        position:static;

        transform:none;

        width:100%;

        height:auto;

        margin-bottom:4px;
    }
}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-height:660px)
and (max-width:799px){

    .cover{
        width:110px;
        height:110px;
    }

    .line{
        font-size:13px;

        padding:6px 0;
    }

    .line.active{
        font-size:15px;
    }

    .lyrics{
        padding-top:20px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="bg"></div>


<!-- =====================================================
     TOP
===================================================== -->

<header class="topbar">

    <strong>HARVEY</strong>

    <span>•</span>

    <span>Lyrics</span>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- COVER -->

    <section class="left">

        <div
            class="cover"
            id="cover">
        </div>


        <div class="song-info">

            <div>

                <div class="song-title">
                    HARVEY
                </div>

                <div class="artist">
                    Her's
                </div>

            </div>


            <button class="more">
                •••
            </button>

        </div>

    </section>



    <!-- LYRICS -->

    <section
        class="lyrics-box"
        id="lyricsBox">

        <div
            class="lyrics"
            id="lyrics">
        </div>

    </section>

</main>



<!-- =====================================================
     PLAYER
===================================================== -->

<footer class="player">


    <div class="player-info">

        <div>

            <div class="player-name">
                HARVEY
            </div>

            <div class="player-artist">
                Her's
            </div>

        </div>

    </div>



    <div class="controls">

        <button id="previous">
            ⏮
        </button>


        <button id="play">
            ▶
        </button>


        <button id="next">
            ⏭
        </button>

    </div>



    <div class="progress-row">

        <span id="current">
            0:00
        </span>


        <div
            class="progress"
            id="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>


        <span id="duration">
            0:00
        </span>

    </div>

</footer>



<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="audio"
    src="harvey.mp3"
    preload="metadata">
</audio>



<script>

/* =====================================================
   TIMESTAMP
===================================================== */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =====================================================
   EDIT LIRIK DI SINI
===================================================== */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];

/* =====================================================
   ELEMENT
===================================================== */

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsBox =
    document.getElementById("lyricsBox");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =====================================================
   CREATE LYRICS
===================================================== */

timestamps.forEach((time,index)=>{

    const line =
        document.createElement("div");

    line.className =
        "line";

    line.dataset.time =
        time;

    line.textContent =
        texts[index] || "";

    lyrics.appendChild(line);

});


const lines =
    [...document.querySelectorAll(".line")];


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(time){

    if(!isFinite(time))
        return "0:00";


    const minutes =
        Math.floor(time / 60);


    let seconds =
        Math.floor(time % 60);


    if(seconds < 10){

        seconds =
            "0" + seconds;

    }


    return minutes + ":" + seconds;

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

play.addEventListener(
    "click",
    async()=>{

        if(audio.paused){

            try{

                await audio.play();

            }catch(error){

                console.log(error);

            }

        }else{

            audio.pause();

        }

    }
);


/* =====================================================
   PLAY STATE
===================================================== */

audio.addEventListener(
    "play",
    ()=>{

        play.textContent =
            "❚❚";

        cover.classList.add(
            "playing"
        );

    }
);


/* =====================================================
   PAUSE STATE
===================================================== */

audio.addEventListener(
    "pause",
    ()=>{

        play.textContent =
            "▶";

        cover.classList.remove(
            "playing"
        );

    }
);


/* =====================================================
   LYRICS SYNC
===================================================== */

let activeIndex = -1;


function updateLyrics(){

    let index = -1;


    for(
        let i = 0;
        i < timestamps.length;
        i++
    ){

        if(
            audio.currentTime >=
            timestamps[i]
        ){

            index = i;

        }else{

            break;

        }

    }


    if(index === activeIndex)
        return;


    activeIndex =
        index;


    lines.forEach(
        line=>{

            line.classList.remove(
                "active"
            );

        }
    );


    if(index >= 0){

        const line =
            lines[index];


        line.classList.add(
            "active"
        );


        const boxRect =
            lyricsBox.getBoundingClientRect();

        const lineRect =
            line.getBoundingClientRect();


        const target =
            lyricsBox.scrollTop
            +
            (
                lineRect.top -
                boxRect.top
            )
            -
            (
                lyricsBox.clientHeight /
                2
            )
            +
            (
                lineRect.height /
                2
            );


        lyricsBox.scrollTo({

            top:
                Math.max(
                    0,
                    target
                ),

            behavior:
                "smooth"

        });

    }

}


/* =====================================================
   TIME UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    ()=>{

        current.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        if(audio.duration){

            bar.style.width =
                (
                    audio.currentTime /
                    audio.duration *
                    100
                )
                +
                "%";

        }


        updateLyrics();

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   PROGRESS CLICK
===================================================== */

progress.addEventListener(
    "click",
    event=>{

        if(!audio.duration)
            return;


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;


        activeIndex = -1;


        updateLyrics();

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previous.addEventListener(
    "click",
    ()=>{

        audio.currentTime = 0;

        activeIndex = -1;


        lyricsBox.scrollTo({

            top:0,

            behavior:"smooth"

        });


        updateLyrics();

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    ()=>{

        let index = -1;


        for(
            let i=0;
            i<timestamps.length;
            i++
        ){

            if(
                audio.currentTime >=
                timestamps[i]
            ){

                index = i;

            }

        }


        const nextIndex =
            index + 1;


        if(
            nextIndex <
            timestamps.length
        ){

            audio.currentTime =
                timestamps[nextIndex];


            activeIndex = -1;


            updateLyrics();

        }

    }
);


/* =====================================================
   SONG END
===================================================== */

audio.addEventListener(
    "ended",
    ()=>{

        play.textContent =
            "▶";


        cover.classList.remove(
            "playing"
        );


        activeIndex = -1;

    }
);


/* =====================================================
   SPACEBAR PLAY / PAUSE
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space"
            &&
            event.target.tagName !== "INPUT"
            &&
            event.target.tagName !== "TEXTAREA"
        ){

            event.preventDefault();

            play.click();

        }

    }
);

</script>

</body>
</html>
