<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HARVEY — Lyrics</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050505;

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button{

    border:none;
    outline:none;

    background:none;

    color:white;

    font-family:inherit;

    cursor:pointer;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg{

    position:fixed;

    inset:-80px;

    background:
        url("cover.jpg")
        center center /
        cover
        no-repeat;

    filter:blur(70px);

    transform:scale(1.15);

    opacity:.16;

    z-index:-2;
}

.bg::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.75),
            rgba(0,0,0,.95)
        );
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:60px;

    padding:0 35px;

    display:flex;

    align-items:center;

    gap:9px;

    z-index:100;
}

.topbar strong{

    font-size:13px;

    letter-spacing:.5px;
}

.topbar span{

    color:#555;

    font-size:12px;
}


/* =====================================================
   MAIN DESKTOP
===================================================== */

.main{

    position:fixed;

    top:60px;

    left:0;
    right:0;

    bottom:96px;

    padding:
        22px 6.5%;

    display:grid;

    grid-template-columns:
        430px
        minmax(400px,720px);

    column-gap:90px;

    align-items:center;

    overflow:hidden;
}


/* =====================================================
   LEFT SIDE
===================================================== */

.left{

    width:430px;

    align-self:center;
}


/* =====================================================
   COVER
===================================================== */

.cover{

    width:430px;

    height:390px;

    aspect-ratio:1 / 1;

    background:
        url("cover.jpg")
        center /
        cover
        no-repeat;

    border-radius:3px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.75);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

.cover.playing{

    transform:scale(1.008);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.9);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{

    width:430px;

    margin-top:14px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.song-title{

    font-size:22px;

    line-height:1.1;

    font-weight:700;

    letter-spacing:.4px;
}

.artist{

    margin-top:4px;

    font-size:12px;

    color:#777;
}

.more{

    color:#777;

    font-size:16px;
}


/* =====================================================
   LYRICS
===================================================== */

.lyrics-box{

    width:100%;

    height:100%;

    overflow-y:auto;

    overflow-x:hidden;

    scrollbar-width:none;

    scroll-behavior:smooth;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 15%,
            black 85%,
            transparent 100%
        );
}

.lyrics-box::-webkit-scrollbar{
    display:none;
}

.lyrics{

    padding-top:42%;

    padding-bottom:42%;
}

.line{

    padding:7px 0;

    font-size:18px;

    line-height:1.45;

    font-weight:700;

    color:#252525;

    opacity:.55;

    transition:

        color .3s ease,

        opacity .3s ease,

        transform .3s ease,

        font-size .3s ease;
}

.line.active{

    color:white;

    opacity:1;

    font-size:24px;

    transform:translateX(2px);

    text-shadow:
        0 0 25px
        rgba(255,255,255,.08);
}


/* =====================================================
   PLAYER
===================================================== */

.player{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;

    height:96px;

    background:
        rgba(6,6,6,.97);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    z-index:999999;
}


/* =====================================================
   PLAYER INFO
===================================================== */

.player-info{

    position:absolute;

    left:35px;

    top:50%;

    transform:
        translateY(-50%);

    width:180px;
}

.player-name{

    font-size:12px;

    font-weight:700;
}

.player-artist{

    margin-top:4px;

    font-size:10px;

    color:#666;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    position:absolute;

    left:50%;

    top:34px;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:30px;

    width:max-content;

    height:48px;
}

.controls button{

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#bbb;

    font-size:16px;

    transition:
        transform .15s ease,
        color .15s ease;
}

.controls button:hover{

    color:white;
}

.controls button:active{

    transform:scale(.82);
}


/* =====================================================
   PLAY BUTTON
===================================================== */

#play{

    width:44px;

    height:44px;

    border-radius:50%;

    background:white;

    color:black;

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.5);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row{

    position:absolute;

    left:50%;

    bottom:9px;

    transform:
        translateX(-50%);

    width:min(
        650px,
        55vw
    );

    height:12px;

    display:flex;

    align-items:center;

    gap:8px;

    color:#666;

    font-size:9px;
}

.progress{

    flex:1;

    height:4px;

    background:#303030;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.bar{

    width:0%;

    height:100%;

    background:white;

    border-radius:20px;
}


/* =====================================================
   DESKTOP 800 - 1100
===================================================== */

@media(
    min-width:800px
)
and
(
    max-width:1100px
){

    .main{

        padding:
            20px 35px;

        grid-template-columns:
            350px
            minmax(300px,1fr);

        column-gap:55px;
    }

    .left{

        width:350px;
    }

    .cover{

        width:350px;

        height:350px;
    }

    .song-info{

        width:350px;
    }

    .line{

        font-size:16px;
    }

    .line.active{

        font-size:21px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(
    max-width:799px
){

    html,
    body{

        height:100dvh;
    }


    /* TOP */

    .topbar{

        height:50px;

        padding:
            0 13px;

        gap:7px;
    }

    .topbar strong{

        font-size:9px;
    }

    .topbar span{

        font-size:9px;
    }


    /* MAIN */

    .main{

        position:fixed;

        top:50px;

        left:0;
        right:0;

        bottom:110px;

        padding:
            12px 14px 0;

        display:flex;

        flex-direction:column;

        align-items:center;

        overflow:hidden;
    }


    /* LEFT */

    .left{

        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;

        flex-shrink:0;
    }


    /* COVER */

    .cover{

        width:58vw;

        height:58vw;

        max-width:250px;

        max-height:250px;

        min-width:155px;

        min-height:155px;
    }


    /* INFO */

    .song-info{

        width:100%;

        margin-top:10px;
    }

    .song-title{

        font-size:17px;
    }

    .artist{

        font-size:10px;

        margin-top:3px;
    }


    /* LYRICS */

    .lyrics-box{

        width:100%;

        flex:1;

        min-height:0;

        margin-top:9px;
    }

    .lyrics{

        padding-top:65px;

        padding-bottom:100px;
    }

    .line{

        padding:6px 0;

        font-size:13px;

        line-height:1.45;
    }

    .line.active{

        font-size:17px;

        color:white;
    }


    /* PLAYER */

    .player{

        height:110px;

        padding:
            7px 14px
            calc(
                7px +
                env(safe-area-inset-bottom)
            );
    }


    /* PLAYER INFO */

    .player-info{

        position:static;

        width:100%;

        height:20px;

        transform:none;

        display:flex;

        align-items:center;

        justify-content:space-between;
    }

    .player-name{

        font-size:11px;
    }

    .player-artist{

        margin-top:0;

        font-size:9px;
    }


    /* CONTROLS */

    .controls{

        position:static;

        transform:none;

        width:100%;

        height:45px;

        display:flex;

        align-items:center;

        justify-content:center;

        gap:28px;
    }

    .controls button{

        width:34px;

        height:34px;
    }

    #play{

        width:42px;

        height:42px;
    }


    /* PROGRESS */

    .progress-row{

        position:static;

        transform:none;

        width:100%;

        height:17px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(
    max-width:380px
){

    .main{

        bottom:106px;
    }

    .player{

        height:106px;
    }

    .cover{

        width:52vw;

        height:52vw;
    }

    .line{

        font-size:12px;
    }

    .line.active{

        font-size:16px;
    }

    .controls{

        gap:24px;
    }
}


/* =====================================================
   SHORT PHONE
===================================================== */

@media(
    max-height:650px
)
and
(
    max-width:799px
){

    .main{

        bottom:104px;
    }

    .player{

        height:104px;
    }

    .cover{

        width:43vw;

        height:43vw;
    }

    .song-info{

        margin-top:7px;
    }

    .lyrics-box{

        margin-top:5px;
    }

    .line{

        padding:4px 0;

        font-size:12px;
    }

    .line.active{

        font-size:16px;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="bg"></div>


<!-- HEADER -->

<header class="topbar">

    <strong>HARVEY</strong>

    <span>•</span>

    <span>Lyrics</span>

</header>


<!-- MAIN -->

<main class="main">


    <!-- COVER + INFO -->

    <section class="left">

        <div
            class="cover"
            id="cover">
        </div>


        <div class="song-info">

            <div>

                <div class="song-title">
                    HARVEY
                </div>

                <div class="artist">
                    Her's
                </div>

            </div>


            <button class="more">
                •••
            </button>

        </div>

    </section>


    <!-- LYRICS -->

    <section
        class="lyrics-box"
        id="lyricsBox">

        <div
            class="lyrics"
            id="lyrics">
        </div>

    </section>

</main>


<!-- PLAYER -->

<footer class="player">


    <div class="player-info">

        <div>

            <div class="player-name">
                HARVEY
            </div>

            <div class="player-artist">
                Her's
            </div>

        </div>

    </div>


    <div class="controls">

        <button id="previous">
            ⏮
        </button>


        <button id="play">
            ▶
        </button>


        <button id="next">
            ⏭
        </button>

    </div>


    <div class="progress-row">

        <span id="current">
            0:00
        </span>


        <div
            class="progress"
            id="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>


        <span id="duration">
            0:00
        </span>

    </div>

</footer>


<!-- AUDIO -->

<audio
    id="audio"
    src="harvey.mp3"
    preload="metadata">
</audio>


<script>

/* =====================================================
   TIMESTAMP
===================================================== */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =====================================================
   TEKS LIRIK
   GANTI BAGIAN INI SENDIRI
===================================================== */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];


/* =====================================================
   ELEMENT
===================================================== */

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsBox =
    document.getElementById("lyricsBox");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =====================================================
   GENERATE LYRICS
===================================================== */

timestamps.forEach(
    (time,index)=>{

        const line =
            document.createElement("div");

        line.className =
            "line";

        line.dataset.time =
            time;

        line.textContent =
            texts[index] || "";

        lyrics.appendChild(line);

    }
);


const lines =
    [...document.querySelectorAll(".line")];


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(time){

    if(!isFinite(time))
        return "0:00";


    const minutes =
        Math.floor(time / 60);


    let seconds =
        Math.floor(time % 60);


    if(seconds < 10){

        seconds =
            "0" + seconds;

    }


    return minutes + ":" + seconds;

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

play.addEventListener(
    "click",
    async ()=>{

        if(audio.paused){

            try{

                await audio.play();

                play.textContent =
                    "❚❚";

                cover.classList.add(
                    "playing"
                );

            }
            catch(error){

                console.log(error);

            }

        }
        else{

            audio.pause();

            play.textContent =
                "▶";

            cover.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   LYRICS SYNC
===================================================== */

let activeIndex = -1;


function updateLyrics(){

    let index = -1;


    for(
        let i = 0;
        i < timestamps.length;
        i++
    ){

        if(
            audio.currentTime >=
            timestamps[i]
        ){

            index = i;

        }
        else{

            break;

        }

    }


    if(index === activeIndex)
        return;


    activeIndex =
        index;


    lines.forEach(
        line=>{

            line.classList.remove(
                "active"
            );

        }
    );


    if(index >= 0){

        const line =
            lines[index];


        line.classList.add(
            "active"
        );


        const target =
            line.offsetTop
            -
            lyricsBox.clientHeight / 2
            +
            line.offsetHeight / 2;


        lyricsBox.scrollTo({

            top:Math.max(
                0,
                target
            ),

            behavior:"smooth"

        });

    }

}


/* =====================================================
   AUDIO UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    ()=>{

        current.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        if(audio.duration){

            bar.style.width =
                (
                    audio.currentTime /
                    audio.duration *
                    100
                ) + "%";

        }


        updateLyrics();

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   PROGRESS CLICK
===================================================== */

progress.addEventListener(
    "click",
    event=>{

        if(!audio.duration)
            return;


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;


        activeIndex = -1;

        updateLyrics();

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previous.addEventListener(
    "click",
    ()=>{

        audio.currentTime =
            0;

        activeIndex =
            -1;


        lyricsBox.scrollTo({

            top:0,

            behavior:"smooth"

        });


        updateLyrics();

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    ()=>{

        let index = -1;


        for(
            let i = 0;
            i < timestamps.length;
            i++
        ){

            if(
                audio.currentTime >=
                timestamps[i]
            ){

                index = i;

            }

        }


        const nextIndex =
            index + 1;


        if(
            nextIndex <
            timestamps.length
        ){

            audio.currentTime =
                timestamps[nextIndex];

            activeIndex =
                -1;

            updateLyrics();

        }

    }
);


/* =====================================================
   SONG END
===================================================== */

audio.addEventListener(
    "ended",
    ()=>{

        play.textContent =
            "▶";

        cover.classList.remove(
            "playing"
        );

        activeIndex =
            -1;

    }
);


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            play.click();

        }

    }
);

</script>

</body>
</html>
