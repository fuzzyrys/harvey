<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>HARVEY</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button {
    font-family: inherit;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;

    inset: -80px;

    background:
        url("cover.jpg")
        center / cover
        no-repeat;

    filter: blur(60px);

    transform: scale(1.15);

    opacity: .30;

    z-index: -3;

    animation:
        ambientMove
        18s
        ease-in-out
        infinite
        alternate;
}

.overlay {
    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.78),
            rgba(0,0,0,.52),
            rgba(0,0,0,.92)
        );

    z-index: -2;
}

.vignette {
    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.65) 100%
        );

    z-index: -1;

    pointer-events: none;
}

@keyframes ambientMove {

    from {
        transform:
            scale(1.15)
            translate3d(0,0,0);
    }

    to {
        transform:
            scale(1.20)
            translate3d(-15px,8px,0);
    }

}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    position: relative;
}


/* =====================================================
   MOBILE TOP BAR
===================================================== */

.topbar {
    height: 58px;

    padding:
        env(safe-area-inset-top)
        18px
        0
        18px;

    display: flex;
    align-items: center;

    flex-shrink: 0;

    font-size: 13px;

    color:
        rgba(255,255,255,.55);
}

.topbar strong {
    color: white;

    font-size: 14px;

    letter-spacing: 1px;
}

.dot {
    margin: 0 8px;

    color:
        rgba(255,255,255,.25);
}


/* =====================================================
   MAIN MOBILE
===================================================== */

.main {
    flex: 1;

    min-height: 0;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        10px
        18px
        0;
}


/* =====================================================
   COVER
===================================================== */

.left {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    flex-shrink: 0;
}

.cover {
    width:
        min(
            72vw,
            300px
        );

    aspect-ratio: 1 / 1;

    background:
        url("cover.jpg")
        center / cover
        no-repeat;

    border-radius: 3px;

    box-shadow:
        0 25px 65px
        rgba(0,0,0,.72);

    transition:
        transform .5s ease,
        box-shadow .5s ease;
}

.cover.playing {
    transform:
        scale(1.012);

    box-shadow:
        0 28px 75px
        rgba(0,0,0,.82),
        0 0 55px
        rgba(255,255,255,.035);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info {
    width: 100%;

    margin-top: 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 2px;
}

.song-text {
    min-width: 0;
}

.song-title {
    font-size: 21px;

    font-weight: 750;

    letter-spacing: .3px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.artist {
    margin-top: 4px;

    font-size: 13px;

    color:
        rgba(255,255,255,.52);
}


/* kecil bulat di samping info */

.more {
    width: 35px;
    height: 35px;

    border: none;

    background: transparent;

    color:
        rgba(255,255,255,.55);

    font-size: 21px;

    flex-shrink: 0;
}


/* =====================================================
   LYRICS MOBILE
===================================================== */

.lyrics-wrapper {
    width: 100%;

    flex: 1;

    min-height: 0;

    margin-top: 15px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    scroll-behavior: smooth;

    position: relative;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 13%,
            black 87%,
            transparent 100%
        );
}

.lyrics-wrapper::-webkit-scrollbar {
    display: none;
}

.lyrics {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    padding-top: 42%;

    padding-bottom: 45%;
}


/* =====================================================
   LYRIC LINE
===================================================== */

.line {
    width: 100%;

    padding: 7px 0;

    font-size: 19px;

    line-height: 1.38;

    font-weight: 700;

    color:
        rgba(255,255,255,.23);

    opacity: .48;

    transform-origin: left center;

    transform:
        scale(.97);

    transition:
        color .4s ease,
        opacity .4s ease,
        transform .4s ease,
        font-size .4s ease,
        filter .4s ease;
}


/* =====================================================
   ACTIVE
===================================================== */

.line.active {
    color: white;

    opacity: 1;

    font-size: 25px;

    transform:
        scale(1);

    filter:
        drop-shadow(
            0 0 13px
            rgba(255,255,255,.10)
        );
}


/* =====================================================
   NEIGHBORS
===================================================== */

.line.active + .line {
    opacity: .60;
}

.line:has(+ .line.active) {
    opacity: .60;
}


/* =====================================================
   MOBILE PLAYER
===================================================== */

.player {
    width: 100%;

    flex-shrink: 0;

    padding:
        10px
        18px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(8,8,8,.90);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,.35);
}


/* =====================================================
   PLAYER TOP
===================================================== */

.player-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 8px;
}

.player-song {
    min-width: 0;
}

.player-title {
    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-artist {
    margin-top: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,.42);
}


/* =====================================================
   PLAYER BUTTONS
===================================================== */

.buttons {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 28px;

    height: 43px;
}

button {
    border: none;

    outline: none;

    background: transparent;

    color:
        rgba(255,255,255,.65);

    cursor: pointer;

    transition:
        transform .15s ease,
        color .15s ease;
}

button:active {
    transform: scale(.88);
}

#play {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 13px;

    display: flex;

    align-items: center;

    justify-content: center;
}

#previous,
#next {
    font-size: 19px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 9px;

    color:
        rgba(255,255,255,.42);
}

.progress {
    flex: 1;

    height: 4px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.20);

    overflow: hidden;
}

.bar {
    width: 0%;

    height: 100%;

    border-radius: 20px;

    background: white;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.35);
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-height: 700px) {

    .topbar {
        height: 48px;
    }

    .main {
        padding-top: 5px;
    }

    .cover {
        width: 190px;
    }

    .song-info {
        margin-top: 10px;
    }

    .lyrics-wrapper {
        margin-top: 8px;
    }

    .line {
        padding: 5px 0;

        font-size: 17px;
    }

    .line.active {
        font-size: 22px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width: 360px) {

    .cover {
        width: 175px;
    }

    .song-title {
        font-size: 19px;
    }

    .line {
        font-size: 17px;
    }

    .line.active {
        font-size: 21px;
    }

    .buttons {
        gap: 24px;
    }

}

</style>
</head>


<body>


<div class="background"></div>
<div class="overlay"></div>
<div class="vignette"></div>


<div class="app">


    <!-- =================================================
         TOP
    ================================================== -->

    <header class="topbar">

        <strong>HARVEY</strong>

        <span class="dot">•</span>

        <span>Lyrics</span>

    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- COVER + INFO -->

        <section class="left">

            <div
                class="cover"
                id="cover">
            </div>


            <div class="song-info">

                <div class="song-text">

                    <div class="song-title">
                        HARVEY
                    </div>

                    <div class="artist">
                        Her's
                    </div>

                </div>


                <button class="more">
                    •••
                </button>

            </div>

        </section>



        <!-- =================================================
             LYRICS
        ================================================== -->

        <section
            class="lyrics-wrapper"
            id="lyricsWrapper">

            <div
                class="lyrics"
                id="lyrics">
            </div>

        </section>


    </main>



    <!-- =================================================
         MOBILE PLAYER
    ================================================== -->

    <footer class="player">


        <div class="player-top">

            <div class="player-song">

                <div class="player-title">
                    HARVEY
                </div>

                <div class="player-artist">
                    Her's
                </div>

            </div>

        </div>


        <div class="buttons">

            <button id="previous">
                ⏮
            </button>

            <button id="play">
                ▶
            </button>

            <button id="next">
                ⏭
            </button>

        </div>


        <div class="progress-row">

            <span id="current">
                0:00
            </span>

            <div
                class="progress"
                id="progress">

                <div
                    class="bar"
                    id="bar">
                </div>

            </div>

            <span id="duration">
                0:00
            </span>

        </div>


    </footer>


</div>



<!-- AUDIO -->

<audio
    id="audio"
    src="harvey.mp3">
</audio>



<script>

/* =====================================================
   TIMESTAMP
===================================================== */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =====================================================
   TEKS LIRIK
===================================================== */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];

/* =====================================================
   ELEMENT
===================================================== */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsWrapper =
    document.getElementById("lyricsWrapper");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =====================================================
   CREATE LYRICS
===================================================== */

timestamps.forEach((time, index) => {

    const line =
        document.createElement("div");

    line.className =
        "line";

    line.dataset.time =
        time;

    line.textContent =
        texts[index] || "";

    lyrics.appendChild(line);

});

const lines =
    Array.from(
        document.querySelectorAll(".line")
    );


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    let secs =
        Math.floor(seconds % 60);

    if (secs < 10) {
        secs = "0" + secs;
    }

    return minutes + ":" + secs;
}


/* =====================================================
   AUDIO FADE
===================================================== */

let fadeTimer = null;

const fadeDuration = 450;


function fadeIn() {

    clearInterval(fadeTimer);

    audio.volume = 0;

    let step = 0;

    const steps = 18;

    fadeTimer =
        setInterval(() => {

            step++;

            audio.volume =
                Math.min(
                    step / steps,
                    1
                );

            if (step >= steps) {

                clearInterval(
                    fadeTimer
                );

            }

        }, fadeDuration / steps);
}


function fadeOut() {

    clearInterval(fadeTimer);

    const startVolume =
        audio.volume;

    let step = 0;

    const steps = 18;

    fadeTimer =
        setInterval(() => {

            step++;

            audio.volume =
                Math.max(
                    startVolume *
                    (1 - step / steps),
                    0
                );

            if (step >= steps) {

                clearInterval(
                    fadeTimer
                );

                audio.pause();

                audio.volume = 1;

            }

        }, fadeDuration / steps);
}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            audio.play();

            fadeIn();

            playButton.textContent =
                "❚❚";

            cover.classList.add(
                "playing"
            );

        } else {

            fadeOut();

            playButton.textContent =
                "▶";

            cover.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   ACTIVE INDEX
===================================================== */

function getActiveIndex(time) {

    let index = -1;

    for (
        let i = 0;
        i < timestamps.length;
        i++
    ) {

        if (
            time >= timestamps[i]
        ) {

            index = i;

        } else {

            break;

        }

    }

    return index;
}


let lastActiveIndex = -1;


/* =====================================================
   CENTER LYRIC
===================================================== */

function centerLine(index) {

    if (index < 0) {
        return;
    }

    const active =
        lines[index];

    if (!active) {
        return;
    }


    const target =
        active.offsetTop
        -
        lyricsWrapper.clientHeight / 2
        +
        active.offsetHeight / 2;


    const maxScroll =
        lyricsWrapper.scrollHeight
        -
        lyricsWrapper.clientHeight;


    const finalPosition =
        Math.max(
            0,
            Math.min(
                target,
                maxScroll
            )
        );


    lyricsWrapper.scrollTo({

        top: finalPosition,

        behavior: "smooth"

    });

}


/* =====================================================
   UPDATE LYRICS
===================================================== */

function updateLyrics() {

    const index =
        getActiveIndex(
            audio.currentTime
        );


    if (
        index === lastActiveIndex
    ) {

        return;

    }


    lastActiveIndex =
        index;


    lines.forEach(line => {

        line.classList.remove(
            "active"
        );

    });


    if (index >= 0) {

        lines[index]
            .classList.add("active");

        centerLine(index);

    }

}


/* =====================================================
   AUDIO UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }


        current.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        bar.style.width =
            percentage + "%";


        updateLyrics();

    }
);


/* =====================================================
   PROGRESS TAP
===================================================== */

progress.addEventListener(
    "click",
    event => {

        if (!audio.duration) {
            return;
        }


        const rect =
            progress.getBoundingClientRect();


        const percentage =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width;


        audio.currentTime =
            percentage *
            audio.duration;


        lastActiveIndex = -1;

        updateLyrics();

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previousButton.addEventListener(
    "click",
    () => {

        audio.currentTime = 0;

        lastActiveIndex = -1;

        lyricsWrapper.scrollTo({

            top: 0,

            behavior: "smooth"

        });

        updateLyrics();

    }
);


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener(
    "click",
    () => {

        const index =
            getActiveIndex(
                audio.currentTime
            );


        const nextIndex =
            index + 1;


        if (
            nextIndex <
            timestamps.length
        ) {

            audio.currentTime =
                timestamps[nextIndex];

            lastActiveIndex = -1;

            updateLyrics();

        }

    }
);


/* =====================================================
   END
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        playButton.textContent =
            "▶";

        cover.classList.remove(
            "playing"
        );

        audio.volume = 1;

        lastActiveIndex = -1;

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            playButton.click();

        }

    }
);

</script>

</body>
</html>
