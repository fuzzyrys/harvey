<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>HARVEY</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button {
    border: 0;
    outline: 0;
    font-family: inherit;
    background: none;
    color: white;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;

    top: -70px;
    left: -70px;
    right: -70px;
    bottom: -70px;

    background:
        url("cover.jpg")
        center / cover
        no-repeat;

    filter: blur(60px);

    transform: scale(1.15);

    opacity: .30;

    z-index: 0;
}

.background::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        rgba(0,0,0,.45);
}


/* =====================================================
   APP
===================================================== */

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    z-index: 2;
}


/* =====================================================
   TOP
===================================================== */

.topbar {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 58px;

    padding:
        env(safe-area-inset-top)
        18px
        0
        18px;

    display: flex;
    align-items: center;

    z-index: 50;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.55),
            transparent
        );

    color:
        rgba(255,255,255,.5);

    font-size: 13px;
}

.topbar strong {
    color: white;

    letter-spacing: 1px;
}

.dot {
    margin: 0 8px;

    color:
        rgba(255,255,255,.25);
}


/* =====================================================
   MAIN
===================================================== */

.main {

    position: absolute;

    top: 58px;
    left: 0;
    right: 0;

    /*
       player = 118px
    */

    bottom: 118px;

    width: 100%;

    padding:
        12px
        18px
        0;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;
}


/* =====================================================
   COVER
===================================================== */

.left {

    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    flex-shrink: 0;
}

.cover {

    width: min(70vw, 290px);

    aspect-ratio: 1 / 1;

    background:
        url("cover.jpg")
        center / cover
        no-repeat;

    border-radius: 4px;

    box-shadow:
        0 25px 65px
        rgba(0,0,0,.75);

    transition:
        transform .45s ease,
        box-shadow .45s ease;
}

.cover.playing {

    transform: scale(1.015);

    box-shadow:
        0 30px 75px
        rgba(0,0,0,.85),
        0 0 60px
        rgba(255,255,255,.04);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info {

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 15px;
}

.song-title {

    font-size: 21px;

    font-weight: 750;

    letter-spacing: .3px;
}

.artist {

    margin-top: 4px;

    font-size: 13px;

    color:
        rgba(255,255,255,.48);
}

.more {

    width: 38px;
    height: 38px;

    font-size: 19px;

    color:
        rgba(255,255,255,.5);
}


/* =====================================================
   LYRICS
===================================================== */

.lyrics-wrapper {

    width: 100%;

    flex: 1;

    min-height: 0;

    margin-top: 15px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    scroll-behavior: smooth;

    position: relative;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
        );
}

.lyrics-wrapper::-webkit-scrollbar {
    display: none;
}

.lyrics {

    width: 100%;

    padding-top: 45%;
    padding-bottom: 45%;

    display: flex;
    flex-direction: column;
}

.line {

    width: 100%;

    padding: 6px 0;

    font-size: 18px;

    line-height: 1.4;

    font-weight: 700;

    color:
        rgba(255,255,255,.22);

    opacity: .42;

    transform-origin: left center;

    transform: scale(.97);

    transition:
        color .4s ease,
        opacity .4s ease,
        transform .4s ease,
        font-size .4s ease;
}

.line.active {

    color: white;

    opacity: 1;

    font-size: 24px;

    transform: scale(1);

    text-shadow:
        0 0 18px
        rgba(255,255,255,.08);
}

.line.active + .line {
    opacity: .58;
}

.line:has(+ .line.active) {
    opacity: .58;
}


/* =====================================================
   PLAYER
===================================================== */

.player {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    height: 118px;

    padding:
        8px
        18px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(8,8,8,.95);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 -15px 40px
        rgba(0,0,0,.45);

    z-index: 9999;
}


/* =====================================================
   PLAYER INFO
===================================================== */

.player-info {

    width: 100%;

    height: 24px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.player-title {

    font-size: 12px;

    font-weight: 700;
}

.player-artist {

    font-size: 10px;

    color:
        rgba(255,255,255,.4);
}


/* =====================================================
   BUTTON AREA
===================================================== */

.buttons {

    width: 100%;

    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 34px;

    position: relative;

    z-index: 10000;
}

.buttons button {

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    color:
        rgba(255,255,255,.72);

    font-size: 19px;

    cursor: pointer;

    touch-action: manipulation;

    position: relative;

    z-index: 10001;
}

.buttons button:active {
    transform: scale(.88);
}


/* =====================================================
   PLAY BUTTON
===================================================== */

#play {

    width: 44px !important;
    height: 44px !important;

    border-radius: 50%;

    background: white;

    color: black !important;

    font-size: 13px !important;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.45);

    display: flex !important;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    position: relative;

    z-index: 10002;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row {

    width: 100%;

    height: 17px;

    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 9px;

    color:
        rgba(255,255,255,.4);
}

.progress {

    flex: 1;

    height: 4px;

    background:
        rgba(255,255,255,.20);

    border-radius: 20px;

    overflow: hidden;

    touch-action: none;
}

.bar {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.3);
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-height: 700px) {

    .main {
        bottom: 110px;
    }

    .player {
        height: 110px;
    }

    .cover {
        width: 190px;
    }

    .song-info {
        margin-top: 9px;
    }

    .lyrics-wrapper {
        margin-top: 8px;
    }

    .line {
        font-size: 16px;
        padding: 5px 0;
    }

    .line.active {
        font-size: 21px;
    }

}


/* =====================================================
   VERY SMALL WIDTH
===================================================== */

@media(max-width: 360px) {

    .cover {
        width: 175px;
    }

    .song-title {
        font-size: 19px;
    }

    .buttons {
        gap: 28px;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width: 851px) {

    .topbar {
        height: 65px;

        padding:
            0 35px;
    }

    .main {

        position: absolute;

        top: 65px;
        bottom: 95px;

        padding:
            20px 6%;

        display: grid;

        grid-template-columns:
            minmax(300px, 420px)
            1fr;

        gap: 90px;

        align-items: center;
    }

    .left {
        width: 100%;
    }

    .cover {
        width: min(400px, 100%);
    }

    .song-info {
        margin-top: 20px;
    }

    .lyrics-wrapper {
        width: 100%;
        height: 100%;

        margin-top: 0;
    }

    .lyrics {
        padding-top: 40%;
        padding-bottom: 40%;
    }

    .line {
        font-size: 20px;
        padding: 7px 0;
    }

    .line.active {
        font-size: 26px;
    }

    .player {

        height: 95px;

        padding:
            10px 35px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .player-info {

        position: absolute;

        left: 35px;

        width: 200px;

        display: block;
    }

    .player-artist {
        margin-top: 4px;
    }

    .buttons {
        width: 300px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background"></div>


<div class="app">


    <!-- TOP -->

    <header class="topbar">

        <strong>HARVEY</strong>

        <span class="dot">•</span>

        <span>Lyrics</span>

    </header>



    <!-- MAIN -->

    <main class="main">


        <!-- COVER -->

        <section class="left">

            <div
                class="cover"
                id="cover">
            </div>


            <div class="song-info">

                <div>

                    <div class="song-title">
                        HARVEY
                    </div>

                    <div class="artist">
                        Her's
                    </div>

                </div>


                <button
                    class="more">
                    •••
                </button>

            </div>

        </section>



        <!-- LYRICS -->

        <section
            class="lyrics-wrapper"
            id="lyricsWrapper">

            <div
                class="lyrics"
                id="lyrics">
            </div>

        </section>


    </main>



    <!-- PLAYER -->

    <footer class="player">


        <div class="player-info">

            <div class="player-title">
                HARVEY
            </div>

            <div class="player-artist">
                Her's
            </div>

        </div>


        <div class="buttons">

            <button id="previous">
                ⏮
            </button>

            <button id="play">
                ▶
            </button>

            <button id="next">
                ⏭
            </button>

        </div>


        <div class="progress-row">

            <span id="current">
                0:00
            </span>

            <div
                class="progress"
                id="progress">

                <div
                    class="bar"
                    id="bar">
                </div>

            </div>

            <span id="duration">
                0:00
            </span>

        </div>


    </footer>

</div>



<!-- AUDIO -->

<audio
    id="audio"
    src="harvey.mp3"
    preload="metadata">
</audio>



<script>

/* =====================================================
   TIMESTAMP
===================================================== */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =====================================================
   LIRIK
   GANTI TEKS INI SESUKA LU
===================================================== */

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];


/* =====================================================
   ELEMENT
===================================================== */

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const wrapper =
    document.getElementById("lyricsWrapper");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =====================================================
   CREATE LYRICS
===================================================== */

timestamps.forEach(
    (time, index) => {

        const line =
            document.createElement("div");

        line.className = "line";

        line.dataset.time = time;

        line.textContent =
            texts[index] || "";

        lyrics.appendChild(line);

    }
);


const lines =
    Array.from(
        document.querySelectorAll(".line")
    );


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const min =
        Math.floor(seconds / 60);

    let sec =
        Math.floor(seconds % 60);

    if (sec < 10) {
        sec = "0" + sec;
    }

    return min + ":" + sec;
}


/* =====================================================
   FADE
===================================================== */

let fadeTimer = null;

function fadeIn() {

    clearInterval(fadeTimer);

    audio.volume = 0;

    let value = 0;

    fadeTimer =
        setInterval(() => {

            value += .06;

            audio.volume =
                Math.min(value, 1);

            if (value >= 1) {

                clearInterval(
                    fadeTimer
                );

            }

        }, 25);
}


function fadeOut() {

    clearInterval(fadeTimer);

    let value =
        audio.volume;

    fadeTimer =
        setInterval(() => {

            value -= .06;

            audio.volume =
                Math.max(value, 0);

            if (value <= 0) {

                clearInterval(
                    fadeTimer
                );

                audio.pause();

                audio.volume = 1;

            }

        }, 25);
}


/* =====================================================
   PLAY
===================================================== */

play.addEventListener(
    "click",
    async () => {

        if (audio.paused) {

            try {

                await audio.play();

                fadeIn();

                play.textContent =
                    "❚❚";

                cover.classList.add(
                    "playing"
                );

            }

            catch(error) {

                console.log(
                    "Audio gagal dimainkan:",
                    error
                );

            }

        }

        else {

            fadeOut();

            play.textContent =
                "▶";

            cover.classList.remove(
                "playing"
            );

        }

    }
);


/* =====================================================
   ACTIVE LYRIC
===================================================== */

let activeIndex = -1;


function findActive(time) {

    let result = -1;

    for (
        let i = 0;
        i < timestamps.length;
        i++
    ) {

        if (
            time >= timestamps[i]
        ) {

            result = i;

        }
        else {

            break;

        }

    }

    return result;
}


/* =====================================================
   CENTER
===================================================== */

function centerLyric(index) {

    if (index < 0) {
        return;
    }

    const line =
        lines[index];

    if (!line) {
        return;
    }


    const target =
        line.offsetTop
        -
        wrapper.clientHeight / 2
        +
        line.offsetHeight / 2;


    wrapper.scrollTo({

        top: Math.max(
            0,
            target
        ),

        behavior: "smooth"

    });

}


/* =====================================================
   UPDATE LYRICS
===================================================== */

function updateLyrics() {

    const index =
        findActive(
            audio.currentTime
        );


    if (
        index === activeIndex
    ) {

        return;

    }


    activeIndex =
        index;


    lines.forEach(
        line => {

            line.classList.remove(
                "active"
            );

        }
    );


    if (index >= 0) {

        lines[index]
            .classList.add(
                "active"
            );

        centerLyric(index);

    }

}


/* =====================================================
   AUDIO TIME
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }


        current.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        bar.style.width =
            percent + "%";


        updateLyrics();

    }
);


/* =====================================================
   PROGRESS TAP
===================================================== */

progress.addEventListener(
    "click",
    event => {

        if (!audio.duration) {
            return;
        }


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            ) /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;


        activeIndex = -1;

        updateLyrics();

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previous.addEventListener(
    "click",
    () => {

        audio.currentTime = 0;

        activeIndex = -1;

        wrapper.scrollTo({

            top: 0,

            behavior: "smooth"

        });

        updateLyrics();

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    () => {

        const index =
            findActive(
                audio.currentTime
            );


        const nextIndex =
            index + 1;


        if (
            nextIndex <
            timestamps.length
        ) {

            audio.currentTime =
                timestamps[nextIndex];

            activeIndex = -1;

            updateLyrics();

        }

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   END
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        play.textContent =
            "▶";

        cover.classList.remove(
            "playing"
        );

        audio.volume = 1;

        activeIndex = -1;

    }
);


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            play.click();

        }

    }
);

</script>

</body>
</html>
