<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARVEY — Lyrics</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}


/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: -80px;

    background-image: url("cover.jpg");

    background-size: cover;
    background-position: center;

    filter: blur(55px);

    transform: scale(1.15);

    opacity: .32;

    z-index: -3;

    animation:
        ambientMove 18s ease-in-out infinite alternate;
}

.overlay {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.055),
            transparent 38%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.90),
            rgba(0,0,0,.52),
            rgba(0,0,0,.90)
        );

    z-index: -2;

    pointer-events: none;
}

.vignette {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.72) 100%
        );

    z-index: -1;

    pointer-events: none;
}

@keyframes ambientMove {

    from {
        transform:
            scale(1.15)
            translate3d(0,0,0);
    }

    to {
        transform:
            scale(1.19)
            translate3d(-15px,7px,0);
    }
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================
   TOP BAR
========================= */

.topbar {
    height: 64px;

    padding: 0 35px;

    display: flex;
    align-items: center;

    color: rgba(255,255,255,.42);

    font-size: 14px;

    flex-shrink: 0;
}

.topbar strong {
    color: white;

    letter-spacing: .5px;
}

.dot {
    margin: 0 9px;

    color: rgba(255,255,255,.25);
}


/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    min-height: 0;

    width: 92%;
    max-width: 1400px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 90px;
}


/* =========================
   LEFT
========================= */

.left {
    width: 43%;

    display: flex;
    flex-direction: column;

    align-items: center;

    text-align: center;

    flex-shrink: 0;
}


/* =========================
   COVER
========================= */

.cover {
    width: min(380px, 90%);
    aspect-ratio: 1 / 1;

    background-image: url("cover.jpg");

    background-size: cover;
    background-position: center;

    position: relative;

    border-radius: 3px;

    box-shadow:
        0 35px 90px rgba(0,0,0,.82),
        0 0 80px rgba(255,255,255,.035);

    transition:
        transform .6s cubic-bezier(.2,.8,.2,1),
        box-shadow .6s ease;
}

.cover::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 32%,
            transparent 70%,
            rgba(0,0,0,.22)
        );

    pointer-events: none;
}

.cover.playing {
    transform: scale(1.015);

    box-shadow:
        0 40px 100px rgba(0,0,0,.88),
        0 0 100px rgba(255,255,255,.06);
}


/* =========================
   SONG INFO
========================= */

.song-title {
    margin-top: 23px;

    font-size: 27px;

    font-weight: 750;

    letter-spacing: 1.5px;

    text-shadow:
        0 3px 20px rgba(0,0,0,.5);
}

.artist {
    margin-top: 7px;

    font-size: 14px;

    color: rgba(255,255,255,.45);
}


/* =========================
   LYRICS WRAPPER
========================= */

.lyrics-wrapper {
    width: 57%;

    height: 470px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;

    scroll-behavior: smooth;

    position: relative;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 17%,
            black 83%,
            transparent 100%
        );
}

.lyrics-wrapper::-webkit-scrollbar {
    display: none;
}


/* =========================
   LYRICS
========================= */

.lyrics {
    width: 100%;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    padding-top: 205px;
    padding-bottom: 205px;
}

.line {
    width: 100%;

    padding: 8px 0;

    font-size: 20px;

    line-height: 1.4;

    font-weight: 700;

    color:
        rgba(255,255,255,.20);

    opacity: .45;

    transform-origin: left center;

    transform: scale(.97);

    transition:
        color .45s ease,
        opacity .45s ease,
        transform .45s ease,
        font-size .45s ease,
        filter .45s ease;
}


/* =========================
   ACTIVE LYRICS
========================= */

.line.active {
    color: white;

    opacity: 1;

    font-size: 26px;

    transform: scale(1);

    filter:
        drop-shadow(
            0 0 14px
            rgba(255,255,255,.10)
        );
}


/* Lirik sebelum & sesudah */

.line.active + .line {
    opacity: .58;
}

.line:has(+ .line.active) {
    opacity: .58;
}


/* =========================
   PLAYER
========================= */

.player {
    height: 92px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 25px;

    padding: 10px 35px;

    background:
        rgba(5,5,5,.84);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 -15px 40px
        rgba(0,0,0,.28);
}


/* =========================
   MINI SONG
========================= */

.mini-song {
    width: 230px;

    display: flex;
    align-items: center;

    gap: 12px;

    flex-shrink: 0;
}

.mini-cover {
    width: 55px;
    height: 55px;

    background-image: url("cover.jpg");

    background-size: cover;
    background-position: center;

    border-radius: 2px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);
}

.mini-title {
    font-size: 13px;

    font-weight: 700;
}

.mini-artist {
    margin-top: 5px;

    font-size: 11px;

    color: #777;
}


/* =========================
   PLAYER CENTER
========================= */

.player-center {
    flex: 1;

    max-width: 850px;

    margin: auto;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 25px;

    margin-bottom: 5px;
}

button {
    border: none;
    outline: none;

    background: transparent;

    color:
        rgba(255,255,255,.55);

    cursor: pointer;

    transition:
        color .2s ease,
        transform .2s ease;
}

button:hover {
    color: white;

    transform: scale(1.1);
}

#play {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 13px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

#play:hover {
    transform: scale(1.08);

    box-shadow:
        0 7px 25px
        rgba(255,255,255,.12);
}


/* =========================
   PROGRESS
========================= */

.progress-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 9px;

    color: #777;

    font-size: 10px;
}

.progress {
    flex: 1;

    height: 4px;

    background:
        rgba(255,255,255,.20);

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

    transition:
        height .15s ease;
}

.progress:hover {
    height: 6px;
}

.bar {
    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.35);

    transition:
        width .08s linear;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 850px) {

    .topbar {
        height: 50px;
        padding: 0 18px;
    }

    .main {
        width: 94%;

        flex-direction: column;

        justify-content: center;

        gap: 25px;
    }

    .left {
        width: 100%;
    }

    .cover {
        width: 190px;
    }

    .song-title {
        font-size: 22px;
    }

    .lyrics-wrapper {
        width: 95%;
        height: 280px;
    }

    .lyrics {
        padding-top: 115px;
        padding-bottom: 115px;
    }

    .line {
        font-size: 17px;
    }

    .line.active {
        font-size: 24px;
    }

    .mini-song {
        display: none;
    }

    .player {
        height: 80px;
        padding: 8px 15px;
    }
}

</style>
</head>


<body>


<div class="background"></div>
<div class="overlay"></div>
<div class="vignette"></div>


<div class="app">


    <!-- TOP -->

    <header class="topbar">

        <strong>HARVEY</strong>

        <span class="dot">•</span>

        <span>Lyrics</span>

    </header>



    <!-- MAIN -->

    <main class="main">


        <!-- COVER -->

        <section class="left">

            <div
                class="cover"
                id="cover">
            </div>

            <div class="song-title">
                HARVEY
            </div>

            <div class="artist">
                Her's
            </div>

        </section>



        <!-- LYRICS -->

        <section
            class="lyrics-wrapper"
            id="lyricsWrapper">

            <div
                class="lyrics"
                id="lyrics">
            </div>

        </section>


    </main>



    <!-- PLAYER -->

    <footer class="player">


        <div class="mini-song">

            <div class="mini-cover"></div>

            <div>

                <div class="mini-title">
                    HARVEY
                </div>

                <div class="mini-artist">
                    Her's
                </div>

            </div>

        </div>



        <div class="player-center">


            <div class="buttons">

                <button id="previous">
                    ⏮
                </button>

                <button id="play">
                    ▶
                </button>

                <button id="next">
                    ⏭
                </button>

            </div>


            <div class="progress-row">

                <span id="current">
                    0:00
                </span>

                <div
                    class="progress"
                    id="progress">

                    <div
                        class="bar"
                        id="bar">
                    </div>

                </div>

                <span id="duration">
                    0:00
                </span>

            </div>


        </div>


    </footer>


</div>


<!-- AUDIO -->

<audio
    id="audio"
    src="harvey.mp3">
</audio>


<script>

/* =========================
   TIMESTAMP
========================= */

const timestamps = [

    30.96,
    34.95,
    38.06,
    42.09,
    45.00,
    46.38,
    48.76,
    50.25,
    52.20,
    53.61,
    55.67,
    56.88,
    57.90,
    59.61,
    62.88,
    66.31,
    71.36,
    73.05,
    76.42,
    79.83,
    85.06,

    111.87,
    113.56,
    116.92,
    120.35,
    125.40,
    127.13,
    130.50,
    133.87,
    138.92,

    152.48,
    154.15,
    157.46,
    160.90,
    165.93,
    167.63,
    171.10,
    174.40,
    179.53,
    181.23,
    184.49,
    187.96

];


/* =========================
   TEKS LIRIK
========================= */

/*
   GANTI BARIS INI SESUAI
   LIRIK VERSI LU.

   JUMLAH HARUS 42 BARIS.
*/

const texts = [
    "some people think I'm acting worse for wear",
    "suffice to say, this is a quaint affair",
    "but no one really knows me like Harvey",
    "and once you've met him, I'm sure you'll agree",
    "(yeah, I get it)",
    "(you wanna know)",
    "(who he is)",
    "(where we go)",
    "(yeah, I get it)",
    "(you wanna see)",
    "(what it is)",
    "(him and me)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "(song)",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy",
    "harvey",
    "nobody knows what I see",
    "nobody knows I'm waiting",
    "waiting for you to call",
    "harvey",
    "nobody knows what I see",
    "everyone thinks I'm crazy",
    "crazy for you, oh boy"
];


/* =========================
   ELEMENT
========================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const cover =
    document.getElementById("cover");

const lyrics =
    document.getElementById("lyrics");

const lyricsWrapper =
    document.getElementById("lyricsWrapper");

const progress =
    document.getElementById("progress");

const bar =
    document.getElementById("bar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =========================
   CREATE LYRICS
========================= */

timestamps.forEach((time, index) => {

    const line =
        document.createElement("div");

    line.className = "line";

    line.dataset.time = time;

    line.textContent =
        texts[index] || "";

    lyrics.appendChild(line);

});

const lines =
    Array.from(
        document.querySelectorAll(".line")
    );


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    let secs =
        Math.floor(seconds % 60);

    if (secs < 10) {
        secs = "0" + secs;
    }

    return minutes + ":" + secs;
}


/* =========================
   FADE AUDIO
========================= */

let fadeTimer = null;

const fadeDuration = 450;


function fadeIn() {

    clearInterval(fadeTimer);

    audio.volume = 0;

    let step = 0;

    const steps = 18;

    fadeTimer = setInterval(() => {

        step++;

        audio.volume =
            Math.min(
                step / steps,
                1
            );

        if (step >= steps) {
            clearInterval(fadeTimer);
        }

    }, fadeDuration / steps);
}


function fadeOut() {

    clearInterval(fadeTimer);

    const startVolume =
        audio.volume;

    let step = 0;

    const steps = 18;

    fadeTimer = setInterval(() => {

        step++;

        audio.volume =
            Math.max(
                startVolume *
                (1 - step / steps),
                0
            );

        if (step >= steps) {

            clearInterval(fadeTimer);

            audio.pause();

            audio.volume = 1;

        }

    }, fadeDuration / steps);
}


/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            audio.play();

            fadeIn();

            playButton.textContent =
                "❚❚";

            cover.classList.add(
                "playing"
            );

        } else {

            fadeOut();

            playButton.textContent =
                "▶";

            cover.classList.remove(
                "playing"
            );

        }

    }
);


/* =========================
   ACTIVE LINE
========================= */

function getActiveIndex(time) {

    let index = -1;

    for (
        let i = 0;
        i < timestamps.length;
        i++
    ) {

        if (time >= timestamps[i]) {
            index = i;
        } else {
            break;
        }

    }

    return index;
}


let lastActiveIndex = -1;


/* =========================
   CENTER LYRIC
========================= */

function centerLine(index) {

    if (index < 0) {
        return;
    }

    const active =
        lines[index];

    if (!active) {
        return;
    }

    const target =
        active.offsetTop
        -
        lyricsWrapper.clientHeight / 2
        +
        active.offsetHeight / 2;

    lyricsWrapper.scrollTo({

        top: Math.max(0, target),

        behavior: "smooth"

    });
}


/* =========================
   UPDATE LYRICS
========================= */

function updateLyrics() {

    const index =
        getActiveIndex(
            audio.currentTime
        );

    if (
        index === lastActiveIndex
    ) {
        return;
    }

    lastActiveIndex = index;

    lines.forEach(line => {

        line.classList.remove(
            "active"
        );

    });

    if (index >= 0) {

        lines[index]
            .classList.add("active");

        centerLine(index);

    }

}


/* =========================
   TIME UPDATE
========================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        current.textContent =
            formatTime(
                audio.currentTime
            );

        duration.textContent =
            formatTime(
                audio.duration
            );

        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        bar.style.width =
            percentage + "%";

        updateLyrics();

    }
);


/* =========================
   PROGRESS CLICK
========================= */

progress.addEventListener(
    "click",
    event => {

        if (!audio.duration) {
            return;
        }

        const rect =
            progress.getBoundingClientRect();

        const percentage =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        audio.currentTime =
            percentage *
            audio.duration;

        lastActiveIndex = -1;

        updateLyrics();

    }
);


/* =========================
   PREVIOUS
========================= */

previousButton.addEventListener(
    "click",
    () => {

        audio.currentTime = 0;

        lastActiveIndex = -1;

        lyricsWrapper.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        updateLyrics();

    }
);


/* =========================
   NEXT
========================= */

nextButton.addEventListener(
    "click",
    () => {

        const index =
            getActiveIndex(
                audio.currentTime
            );

        const nextIndex =
            index + 1;

        if (
            nextIndex <
            timestamps.length
        ) {

            audio.currentTime =
                timestamps[nextIndex];

            lastActiveIndex = -1;

            updateLyrics();

        }

    }
);


/* =========================
   SONG END
========================= */

audio.addEventListener(
    "ended",
    () => {

        playButton.textContent =
            "▶";

        cover.classList.remove(
            "playing"
        );

        audio.volume = 1;

        lastActiveIndex = -1;

    }
);


/* =========================
   METADATA
========================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================
   SPACEBAR
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
        ) {

            if (
                document.activeElement.tagName ===
                "INPUT" ||
                document.activeElement.tagName ===
                "TEXTAREA"
            ) {
                return;
            }

            event.preventDefault();

            playButton.click();

        }

    }
);

</script>

</body>
</html>
